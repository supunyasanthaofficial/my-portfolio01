image: node:20

stages:
  - validate
  - build

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

lint-and-typecheck:
  stage: validate
  script:
    - npm run lint
    - npx tsc --noEmit

build-production:
  stage: build
  script:
    - npm run build
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
